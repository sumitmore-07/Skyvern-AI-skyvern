<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TechMart - Table Layout</title>
<style>
  body { font-family: Arial, sans-serif; margin: 2rem; }
  table { border-collapse: collapse; width: 100%; max-width: 720px; }
  th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
  th { background: #f0f0f0; }
</style>
</head>
<body>
<h1>TechMart</h1>
<p>Everyday tech at fair prices. All prices in USD.</p>
<table>
  <tr><th>Product</th><th>Price</th><th>Availability</th></tr>
  <tr><td>Wireless Mouse</td><td>$24.99</td><td>In stock</td></tr>
  <tr><td>Mechanical Keyboard</td><td>$79.00</td><td>In stock</td></tr>
  <tr><td>USB-C Hub</td><td>$39.50</td><td>In stock</td></tr>
  <tr><td>27-inch Monitor</td><td>$219.00</td><td>In stock</td></tr>
  <tr><td>Laptop Stand</td><td>$32.00</td><td>In stock</td></tr>
  <tr><td>HD Webcam</td><td>$54.99</td><td>In stock</td></tr>
</table>
</body>
</html>
